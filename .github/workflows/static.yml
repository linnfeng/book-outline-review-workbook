name: Deploy static content to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build static guide
        run: |
          mkdir -p _site
          cat > _site/index.html <<'PAGE_EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book outline review workbook</title></head><body><main>
          <h1>A practical workbook for reviewing a book outline</h1>
          <p>A useful outline gives a draft direction without making every paragraph inevitable. This workbook offers a small repeatable review for fiction and nonfiction projects. It is a planning aid, not a substitute for subject expertise, editorial judgment or feedback from intended readers.</p>
          <h2>1. Define the reader&#x27;s destination</h2>
          <p>Write one sentence describing what the reader should understand, feel or be able to do after the book. Then add a sentence about the person most likely to want that outcome. For nonfiction, a reader might need to evaluate a choice or follow a process. For fiction, the destination may be an emotional change or the resolution of a dramatic question. Keep this statement visible while arranging chapters.</p>
          <h2>2. Assign each chapter a job</h2>
          <p>Create a table with four columns: chapter, reader question or dramatic turn, supporting material, and the transition to the next chapter. Summarize each row in one or two sentences. If two rows do the same work, consider combining them or giving them distinct purposes. If a row cannot be explained without referring to a missing step, add a bridge or move the material earlier.</p>
          <p>For nonfiction, distinguish evidence from commentary and record the source you intend to verify. For fiction, note the characters&#x27; goals, obstacles and consequences. A chapter can contain several scenes, but a list of events alone is not a reason for the reader to continue. Ask what changes because those events occur.</p>
          <h2>3. Draft in manageable passes</h2>
          <p>Choose one chapter and write a rough version with its assigned job in mind. A browser-based tool such as <a href="https://ai-book-writer.org/">https://ai-book-writer.org/</a> can help propose an outline or editable chapter draft; AIWriteBook also describes manuscript exports in DOCX, EPUB, HTML and Markdown. Treat generated text as material to review, not as an authority. Compare the draft to the plan, replace generic passages with specific observations, and remove invented quotations or unsupported claims.</p>
          <p>The service offers 100 welcome credits without a card and also sells subscriptions and one-time credit packs. Check current terms and prices before relying on a particular feature. This guide is project-associated and was prepared with AI assistance; it is not an independent product test.</p>
          <h2>4. Run an evidence and continuity pass</h2>
          <p>For every factual assertion, identify a reliable source and check that it supports the exact claim. Verify quotations against their originals, keep dates and units consistent, and do not retain citations that cannot be located. Avoid putting confidential material into external tools without reviewing the applicable terms and permissions.</p>
          <p>For a story, keep a simple continuity ledger: character names, motivations, timeline, locations and unresolved promises to the reader. Check whether a later scene relies on information that has not been established. Where a viewpoint changes, verify that the new viewpoint has a clear reason and does not accidentally reveal knowledge unavailable to that character.</p>
          <h2>5. Test the handoff</h2>
          <p>Export a copy, open it in the intended editor or reader, and inspect headings, paragraph breaks, lists and chapter order. Save an untouched version before making another revision. Ask a trusted reader to identify where they became confused, rather than asking only whether they liked the chapter. Turn their feedback into concrete questions and revise one problem at a time.</p>
          <h3>Final checklist</h3>
          <ul>
          <li>Can you describe the intended reader and the book&#x27;s purpose?</li>
          <li>Does each chapter make a distinct contribution and lead naturally to the next?</li>
          <li>Are important facts, quotations and permissions independently checked?</li>
          <li>Is AI-generated material reviewed, edited and disclosed where required?</li>
          <li>Does the exported manuscript remain readable in the destination format?</li>
          </ul>
          <p>No checklist guarantees a finished or publishable book. Its purpose is to make revision decisions visible so that authors can keep control of their work.</p>
          </main></body></html>
          PAGE_EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
